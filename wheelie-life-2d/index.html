<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Wheelie Life 2D</title>
  <meta name="description" content="Side-view wheelie game. Hold the front wheel up, keep your balance and build the multiplier.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='46' r='9' fill='none' stroke='%2352a85a' stroke-width='4'/%3E%3Ccircle cx='50' cy='30' r='9' fill='none' stroke='%2352a85a' stroke-width='4'/%3E%3Cpath d='M16 46L36 40 44 34' stroke='%23ddd' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="player">
    <div class="bar">
      <div class="bar-left">
        <button id="flag" class="tool flag" type="button" aria-label="Start (green flag)">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4v25" stroke="#2e8b3a" stroke-width="3" stroke-linecap="round"/><path d="M9 6c5-3 8 3 14 0v11c-6 3-9-3-14 0z" fill="#4cc25a" stroke="#2e8b3a" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button id="stop" class="tool stop" type="button" aria-label="Stop">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 3h10l8 8v10l-8 8H11l-8-8V11z" fill="#ec5959" stroke="#c94040" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button id="full" class="tool full" type="button" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5M4 4l6 6M20 4l-6 6M4 20l6-6M20 20l-6-6" stroke="#575e75" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="stage">
      <canvas id="cv" width="960" height="720" aria-label="Game view"></canvas>
      <div id="hud">
        <div class="panel hs"><svg class="cloud" viewBox="0 0 24 16" aria-hidden="true"><path d="M6 15a5 5 0 0 1-.5-9.9A6 6 0 0 1 17 4.5 4.6 4.6 0 0 1 18 15z" fill="#575e75"/></svg><span>High score</span><b id="high">0</b></div>
        <div class="panel mult"><span>Multiplier</span><b id="mult">1</b></div>
        <b id="score" class="chip score">0</b>
        <div class="panel mph"><span>MPH</span><b id="mph">0</b></div>
      </div>
      <div id="msg" class="msg" role="status"></div>
      <button id="brake" class="touch-brake" type="button">Brake</button>
    </div>
    <p class="help"><b>Space</b> / <b>Up</b> or hold the screen: gas &middot; <b>Down</b> / <b>S</b>: brake &middot; <b>Enter</b>: start / retry &middot; <b>M</b>: mute</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
