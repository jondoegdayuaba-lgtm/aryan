<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a0b2e">
<title>Scratch Tycoon</title>
<style>
:root{
  --bg:#1a0b2e; --panel:#2f1756; --panel2:#24104400; --line:#5b2d9a;
  --gold:#ffd23f; --gold2:#f5a700; --green:#39ff8a; --pink:#ff4fa3; --red:#ff4d5e; --cyan:#4fd1ff;
  --text:#fff; --muted:#c9b6ef;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;overflow-x:hidden}
body{background:radial-gradient(ellipse at 50% -10%,#4a1c80 0%,#26104a 45%,#14071f 100%) fixed;
  background-color:var(--bg);user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:26px 26px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:14px;font-weight:800;color:inherit;font-size:14px}
h2{margin:0 0 10px;font-size:19px;letter-spacing:.5px;color:var(--gold);text-shadow:0 2px 0 #7a4b00}
small{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{background:linear-gradient(#ffe066,#f5b700);color:#3a2300;padding:8px 12px;
  box-shadow:0 4px 0 #a86f00,0 6px 12px rgba(0,0,0,.35);transition:transform .12s cubic-bezier(.3,1.8,.5,1),filter .15s;
  white-space:nowrap;line-height:1.1}
.btn:hover:not(:disabled){transform:translateY(-2px) scale(1.05)}
.btn:active:not(:disabled){transform:translateY(3px) scale(.97);box-shadow:0 1px 0 #a86f00,0 2px 5px rgba(0,0,0,.3)}
.btn:disabled{filter:grayscale(.85) brightness(.65);cursor:not-allowed}
.btn.green{background:linear-gradient(#8dffc2,#1fd16f);color:#04361a;box-shadow:0 4px 0 #0d8043,0 6px 12px rgba(0,0,0,.35)}
.btn.pink{background:linear-gradient(#ff9ccf,#ff3d99);color:#4a0027;box-shadow:0 4px 0 #a3125a,0 6px 12px rgba(0,0,0,.35)}
.btn.purple{background:linear-gradient(#b48cff,#7b3fe4);color:#fff;box-shadow:0 4px 0 #4a1f9a,0 6px 12px rgba(0,0,0,.35)}
.btn.red{background:linear-gradient(#ff8a95,#e5243b);color:#fff;box-shadow:0 4px 0 #8f1020,0 6px 12px rgba(0,0,0,.35)}
.btn.small{padding:6px 9px;font-size:12px;border-radius:11px}
.iconbtn{width:42px;height:42px;font-size:20px;padding:0;border-radius:50%;background:linear-gradient(#5a2ca0,#3b1a70);
  box-shadow:0 3px 0 #22093f,inset 0 2px 0 rgba(255,255,255,.2);transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.iconbtn:hover{transform:scale(1.12) rotate(-6deg)}

/* ---------- layout ---------- */
#app{max-width:1440px;margin:0 auto;padding:8px 12px 18px;min-height:100vh;display:flex;flex-direction:column}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:4px 4px 10px;
  position:sticky;top:0;z-index:20;background:linear-gradient(#1f0c38 70%,rgba(31,12,56,0));}
.logo{font-family:"Arial Black","Trebuchet MS",sans-serif;font-size:28px;line-height:.95;transform:rotate(-3deg);
  background:linear-gradient(#fff6a8,#ffd23f 45%,#ff9d00);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #7a2d00) drop-shadow(0 0 12px rgba(255,190,0,.35));letter-spacing:1px}
.logo span{display:block;font-size:.62em;background:linear-gradient(#b6ffd5,#39ff8a);-webkit-background-clip:text;background-clip:text}
#moneyBox{text-align:center;padding:6px 26px 8px;border-radius:22px;min-width:230px;
  background:linear-gradient(#2a1150,#140828);border:3px solid var(--gold);
  box-shadow:0 0 0 3px #7a4b00,0 0 25px rgba(255,210,63,.35),inset 0 0 18px rgba(255,210,63,.18)}
#moneyBox .lbl{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:800}
#money{font-family:"Arial Black","Trebuchet MS",sans-serif;font-size:34px;line-height:1.05;color:var(--green);
  text-shadow:0 0 12px rgba(57,255,138,.6),0 3px 0 #063d1f;transition:transform .15s}
#money.bump{animation:bump .3s}
#loanInfo{font-size:12px;color:var(--red);font-weight:800;min-height:0}
.hbtns{display:flex;gap:8px;justify-content:flex-end}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

main{display:grid;grid-template-columns:270px minmax(0,1fr) 350px;gap:14px;flex:1;align-items:start}
.panel{background:linear-gradient(170deg,#3a1d6c,#261048);border:3px solid var(--line);border-radius:22px;padding:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.08)}
#right,#left{position:sticky;top:84px;max-height:calc(100vh - 96px);overflow:auto;scrollbar-width:thin;scrollbar-color:#6b3ab0 transparent}

/* ---------- center / table ---------- */
#center{display:flex;flex-direction:column;align-items:center;gap:12px}
#table{width:100%;border-radius:26px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;
  background:
    repeating-linear-gradient(92deg,rgba(0,0,0,.07) 0 2px,transparent 2px 23px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 40px,rgba(0,0,0,.04) 40px 85px),
    linear-gradient(#8a5a36,#6b4226);
  border:5px solid #4a2b16;box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 12px 30px rgba(0,0,0,.45)}
#cardStage{position:relative;display:flex;justify-content:center;align-items:center;width:100%;
  min-height:calc(var(--cw) * 500 / 360 + 8px);--cw:min(360px,88vw,calc((100vh - 285px) * .72));--cw:max(240px,min(360px,88vw,calc((100vh - 285px) * .72)))}
#cardWrap{position:relative;width:var(--cw);aspect-ratio:360/500;filter:drop-shadow(0 12px 16px rgba(0,0,0,.5))}
#cardWrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cFoil{touch-action:none;cursor:crosshair}
#cFx{pointer-events:none}
#cardWrap.hidden{visibility:hidden}
#cardWrap.enter{animation:cardIn .45s cubic-bezier(.3,1.5,.5,1)}
#cardWrap.exit{animation:cardOut .38s ease-in forwards}
#cardWrap.nope{animation:nope .45s}
@keyframes cardIn{0%{transform:translateY(-60px) rotate(-8deg) scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes cardOut{to{transform:translateX(130%) rotate(18deg);opacity:0}}
@keyframes nope{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(9px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
#emptyMsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
#emptyMsg .ghost{width:min(220px,60vw);aspect-ratio:360/500;border:4px dashed rgba(255,255,255,.35);border-radius:20px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-weight:800;font-size:17px;
  color:#ffeccc;text-shadow:0 2px 0 rgba(0,0,0,.4);padding:14px;background:rgba(0,0,0,.12)}
#emptyMsg .ghost b{font-size:44px}
#popup{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(0);pointer-events:none;text-align:center;z-index:5;white-space:nowrap}
#popup .big{font-family:"Arial Black","Trebuchet MS",sans-serif;font-size:58px;line-height:1;color:var(--gold);
  -webkit-text-stroke:3px #5a2a00;text-shadow:0 5px 0 #5a2a00,0 0 30px rgba(255,210,63,.8)}
#popup .sub{margin-top:6px;font-weight:800;font-size:17px;background:rgba(20,6,40,.85);display:inline-block;padding:5px 12px;border-radius:12px;border:2px solid var(--gold)}
#popup.show.win{animation:popWin 1.7s cubic-bezier(.3,1.6,.5,1) forwards}
#popup.show.lose{animation:popLose 1.2s ease forwards}
#popup.lose .big{font-size:40px;color:#d9d4e6;-webkit-text-stroke:2px #2a2140;text-shadow:0 4px 0 #2a2140}
#popup.lose .sub{border-color:#8a7fb0}
@keyframes popWin{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg)}18%{transform:translate(-50%,-50%) scale(1.25) rotate(4deg)}
  30%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}85%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-70%) scale(.9);opacity:0}}
@keyframes popLose{0%{transform:translate(-50%,-50%) scale(0)}15%{transform:translate(-50%,-50%) scale(1.05)}
  25%{transform:translate(-52%,-50%) scale(1)}35%{transform:translate(-48%,-50%)}45%{transform:translate(-51%,-50%)}55%{transform:translate(-50%,-50%)}
  85%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-40%)}}
.hint{font-size:12px;color:#ffe6c4;opacity:.85;text-align:center;min-height:16px}

/* pile */
#pile{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:10px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;border-radius:14px;font-weight:800;font-size:13px;
  background:linear-gradient(var(--c1),var(--c2));box-shadow:0 3px 0 rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.35);
  animation:chipIn .3s cubic-bezier(.3,1.6,.5,1)}
.chip .cnt{background:rgba(0,0,0,.35);border-radius:8px;padding:1px 6px}
@keyframes chipIn{from{transform:scale(.5);opacity:0}}

/* sink */
#sink{position:relative;display:flex;align-items:center;gap:16px;justify-content:center;width:100%;padding:6px 0 2px}
#btnWash{position:relative;display:flex;align-items:center;gap:12px;padding:10px 22px 10px 12px;border-radius:40px;font-size:18px;
  background:linear-gradient(#7ee8ff,#1fa6e0);color:#022d44;box-shadow:0 5px 0 #0b6a96,0 8px 16px rgba(0,0,0,.35);
  transition:transform .12s cubic-bezier(.3,1.8,.5,1)}
#btnWash:hover{transform:translateY(-2px) scale(1.04)}
#btnWash:active{transform:translateY(3px) scale(.96);box-shadow:0 2px 0 #0b6a96}
#btnWash .plate{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#fff 0 38%,#dfe9f2 40% 58%,#fff 60% 66%,#b9c9d8 68%);
  box-shadow:0 2px 4px rgba(0,0,0,.3);position:relative}
#btnWash .plate::after{content:"";position:absolute;left:12px;top:14px;width:10px;height:6px;border-radius:50%;background:rgba(160,120,60,.55);transition:opacity .2s}
#btnWash.scrub .plate{animation:scrub .35s}
#btnWash.scrub .plate::after{opacity:0}
@keyframes scrub{0%{transform:rotate(0)}30%{transform:rotate(-25deg)}60%{transform:rotate(20deg)}100%{transform:rotate(0)}}
#btnWash small{display:block;font-size:12px;color:#044a6e}
.bubble{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95) 0 15%,rgba(180,240,255,.35) 40%,rgba(120,210,255,.15) 70%);
  border:1.5px solid rgba(255,255,255,.7)}

/* ---------- shop ---------- */
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:9px 4px;border-radius:12px;background:#24104a;color:var(--muted);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);transition:transform .12s}
.tab:hover{transform:translateY(-1px)}
.tab.on{background:linear-gradient(#ffe066,#f5b700);color:#3a2300;box-shadow:0 3px 0 #a86f00}
.tab.glow{animation:glow 1.2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 14px var(--pink),0 3px 0 #a86f00}}
.item{display:flex;gap:10px;align-items:center;padding:9px;border-radius:16px;margin-bottom:8px;
  background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.07);transition:transform .15s,border-color .15s}
.item:hover{border-color:rgba(255,210,63,.35);transform:translateX(-2px)}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:15px}
.item .info small{display:block;font-size:11.5px;line-height:1.3}
.item .btns{display:flex;flex-direction:column;gap:7px;align-items:stretch}
.item.locked{opacity:.75}
.mini{width:44px;height:60px;border-radius:8px;flex:none;position:relative;background:linear-gradient(160deg,var(--c1),var(--c2));
  border:2px solid rgba(255,255,255,.5);box-shadow:0 3px 0 rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding-top:7px;
  font-size:9.5px;font-weight:900;text-align:center;line-height:1;color:#fff;text-shadow:0 1px 0 #000}
.mini::after{content:"";position:absolute;left:6px;right:6px;bottom:7px;height:16px;border-radius:4px;background:linear-gradient(120deg,#c9ced6,#f3f5f8,#a4abb6)}
.ico{width:44px;height:44px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;
  background:linear-gradient(#5a2ca0,#3b1a70);box-shadow:0 3px 0 #1c0838}
.lvl{display:inline-block;background:var(--gold);color:#3a2300;border-radius:7px;padding:0 6px;font-size:11px;margin-left:4px;vertical-align:2px}
.badge{display:inline-block;background:var(--pink);color:#fff;border-radius:7px;padding:0 6px;font-size:10px;margin-left:4px;vertical-align:2px}
.bar{height:8px;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#b6ff5a);border-radius:5px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:6px 0}
.pp{color:var(--pink);font-weight:900}

/* ---------- auto scratcher ---------- */
.machine{border-radius:18px;padding:10px;background:linear-gradient(#8e98a8,#5d6677);border:3px solid #2e3440;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 6px 0 #22262e;margin-bottom:10px;position:relative}
.machine .lights{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.machine .lights i{width:9px;height:9px;border-radius:50%;background:#553;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.machine.run .lights i{animation:blink .6s infinite alternate}
.machine.run .lights i:nth-child(2){animation-delay:.2s}.machine.run .lights i:nth-child(3){animation-delay:.4s}
@keyframes blink{from{background:#553}to{background:var(--green);box-shadow:0 0 8px var(--green)}}
.mscreen{background:#0b1d12;border-radius:10px;padding:8px;border:2px solid #1d2a22;color:var(--green);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;box-shadow:inset 0 0 12px rgba(57,255,138,.2)}
.mscreen .bar{background:#10331f}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px;margin-top:8px}
.slot{height:44px;border-radius:6px;border:2px dashed rgba(0,0,0,.35);background:rgba(0,0,0,.12)}
.slot.full{border:2px solid rgba(255,255,255,.6);background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 2px 0 rgba(0,0,0,.35);
  font-size:9px;font-weight:900;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;text-shadow:0 1px 0 #000}
.slot.full.cur{animation:jiggle .35s infinite alternate}
@keyframes jiggle{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(-2px)}}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:7px 0;font-size:13px}
.row select{background:#1b0b33;color:#fff;border:2px solid var(--line);border-radius:10px;padding:5px;font-weight:700;font-family:inherit;max-width:150px}
.log{list-style:none;margin:8px 0 0;padding:0;font-size:12px}
.log li{padding:3px 6px;border-radius:6px;margin-bottom:3px;background:rgba(0,0,0,.2);animation:chipIn .25s}
.log li.w{color:var(--green)}.log li.l{color:#b7a8d6}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex:none}
.switch input{display:none}
.switch span{position:absolute;inset:0;border-radius:14px;background:#1b0b33;border:2px solid var(--line);transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#aaa;transition:.2s}
.switch input:checked+span{background:#0d6b3a;border-color:var(--green)}
.switch input:checked+span::after{left:22px;background:var(--green)}

/* ---------- overlays ---------- */
#modalBg{position:fixed;inset:0;background:rgba(8,2,18,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(3px)}
#modalBg.show{display:flex}
#modal{background:linear-gradient(170deg,#43207c,#2a114f);border:4px solid var(--gold);border-radius:24px;padding:20px;width:min(440px,100%);
  box-shadow:0 0 0 4px #7a4b00,0 20px 60px rgba(0,0,0,.6);animation:cardIn .35s cubic-bezier(.3,1.5,.5,1);max-height:90vh;overflow:auto}
#modal h3{margin:0 0 10px;font-size:24px;color:var(--gold);text-shadow:0 2px 0 #7a4b00}
#modal .body{font-size:15px;line-height:1.45;margin-bottom:16px}
#modal .mbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.stats{width:100%;border-collapse:collapse}
.stats td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.1)}
.stats td:last-child{text-align:right;font-weight:800;color:var(--green)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
#toasts{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:rgba(20,6,40,.95);border:2px solid var(--gold);border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.5);animation:toast 2.8s forwards;text-align:center}
@keyframes toast{0%{transform:translateY(-20px) scale(.8);opacity:0}10%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.coin{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;z-index:96;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23f 45%,#d99400);border:2px solid #9a6300;
  color:#8a5a00;font:900 12px/18px Arial,sans-serif;text-align:center}
.floatTxt{position:fixed;z-index:97;pointer-events:none;font-family:"Arial Black","Trebuchet MS",sans-serif;font-size:20px;
  color:var(--green);-webkit-text-stroke:1px #04361a;text-shadow:0 2px 0 #04361a;transform:translate(-50%,-50%)}
#app.shake{animation:shake .55s}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-9px,5px) rotate(-.6deg)}20%{transform:translate(8px,-6px) rotate(.6deg)}
  30%{transform:translate(-7px,-4px)}40%{transform:translate(6px,5px)}55%{transform:translate(-4px,2px)}70%{transform:translate(3px,-2px)}85%{transform:translate(-1px,1px)}}

/* ---------- mobile ---------- */
@media (max-width:1060px){
  main{grid-template-columns:minmax(0,1fr) 330px}
  #left{grid-column:1 / -1;order:3;position:static;max-height:none}
  #center{order:1}#right{order:2}
}
@media (max-width:760px){
  #app{padding:4px 8px 16px}
  header{grid-template-columns:auto 1fr auto;gap:6px;padding-bottom:6px}
  .logo{font-size:17px}
  #moneyBox{min-width:0;padding:4px 10px 5px;border-width:2px}
  #money{font-size:24px}
  .iconbtn{width:34px;height:34px;font-size:16px}
  .hbtns{gap:4px}
  main{grid-template-columns:1fr;gap:10px}
  #right,#left{position:static;max-height:none}
  #cardStage{--cw:max(230px,min(360px,86vw,calc((100vh - 250px) * .72)))}
  #table{padding:12px 6px;border-radius:20px}
  #btnWash{font-size:16px}
  #popup .big{font-size:44px}
  #toasts{top:70px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">SCRATCH<span>TYCOON</span></div>
    <div id="moneyBox"><div class="lbl">CASH</div><div id="money">$0</div><div id="loanInfo"></div></div>
    <div class="hbtns">
      <button class="iconbtn" id="btnMute" title="Mute / unmute">🔊</button>
      <button class="iconbtn" id="btnStats" title="Stats">📊</button>
      <button class="iconbtn" id="btnSettings" title="Settings">⚙️</button>
    </div>
  </header>
  <main>
    <section id="left" class="panel"></section>
    <section id="center">
      <div id="table">
        <div id="cardStage">
          <div id="cardWrap" class="hidden">
            <canvas id="cBase"></canvas><canvas id="cFoil"></canvas><canvas id="cFx"></canvas>
          </div>
          <div id="emptyMsg"><div class="ghost"><b>🎟️</b><span id="emptyTxt">Wash some dishes to earn cash!</span></div></div>
          <div id="popup"></div>
        </div>
        <div class="hint" id="hint"></div>
        <div id="pile"></div>
      </div>
      <div id="sink">
        <button id="btnWash"><span class="plate"></span><span>Wash Dishes<small id="washVal">+$1 per dish</small></span></button>
      </div>
    </section>
    <section id="right" class="panel">
      <div class="tabs">

function ptFromEvent(e) {
  const r = cFoil.getBoundingClientRect();

function dab(x, y, r) {

  fctx.globalCompositeOperation = 'source-over';

    const c0 = Math.max(0, Math.floor((x - r - p.x) / CELL)), c1 = Math.min(p.cols - 1, Math.floor((x + r - p.x) / CELL));
    const r0 = Math.max(0, Math.floor((y - r - p.y) / CELL)), r1 = Math.min(p.rows - 1, Math.floor((y + r - p.y) / CELL));
    for (let j = r0; j <= r1; j++) for (let i = c0; i <= c1; i++) {
      const idx = j * p.cols + i; if (p.grid[idx]) continue;
      const cx = p.x + (i + .5) * CELL - x, cy = p.y + (j + .5) * CELL - y;

    }

}
function scratchAt(x, y) {
  if (!active || active.done) return 0;
  const r = brushR();

  for (let k = 0; k < Math.min(S.upg.area, 8) && active && !active.done; k++) {
    const a = Math.random() * TAU, dist = r * rand(.6, 1.3);
    n += dab(x + Math.cos(a) * dist, y + Math.sin(a) * dist, r * .55);
  }
  if (n > 0) {
    const now = performance.now();
    if (now - lastScrSnd > 55) { sfx.scratch(); lastScrSnd = now; }
    if (flakes.length < 260) for (let k = 0; k < 2; k++) if (Math.random() < .7) spawnFlake(x + rand(-r, r) * .6, y + rand(-r, r) * .6);
  }

}

}

    s: rand(2, 5), life: rand(30, 55), max: 55, col: pick(['#e9edf2', '#c3c9d2', '#a4acb8', '#ffffff', '#d8dde4']) });
}

  p.revealed = true;
  fctx.clearRect(p.x - 4, p.y - 4, p.w + 8, p.h + 8);
  for (let i = 0; i < Math.min(26, 8 + p.w * p.h / 1500); i++) spawnFlake(p.x + Math.random() * p.w, p.y + Math.random() * p.h, true);
  sfx.reveal();

}

let coinsActive = 0;
function pay(amount, fromEl, quiet = false) {
  let repay = 0;
  if (S.loan > 0) {
    repay = Math.min(S.loan, Math.ceil(amount * 0.2));
    S.loan -= repay;
    if (S.loan <= 0) { S.loan = 0; toast('🎉 Loan fully repaid!'); }
  }
  S.money += amount - repay;
  S.runEarned += amount; S.stats.earned += amount;
  if (amount > S.stats.biggest) S.stats.biggest = amount;
  if (fromEl) flyCoins(fromEl, amount, quiet);
}
function flyCoins(fromEl, amount, quiet) {
  const src = fromEl.getBoundingClientRect(), tgt = $('#money').getBoundingClientRect();
  let n = Math.min(14, 3 + Math.floor(Math.log10(amount + 1) * 2));
  if (quiet) n = Math.min(n, 4);
  if (coinsActive > 50) n = 1;
  const sx0 = src.left + src.width / 2, sy0 = src.top + src.height / 2;
  const tx = tgt.left + tgt.width / 2, ty = tgt.top + tgt.height / 2;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div'); el.className = 'coin'; el.textContent = '$';
    const sx = sx0 + rand(-src.width * .25, src.width * .25), sy = sy0 + rand(-src.height * .2, src.height * .2);
    el.style.left = sx + 'px'; el.style.top = sy + 'px';
    document.body.appendChild(el); coinsActive++;
    const anim = el.animate([
      { transform: 'translate(0,0) scale(.4)', opacity: 0 },
      { transform: `translate(${rand(-70, 70)}px,${rand(-90, -30)}px) scale(1.15)`, opacity: 1, offset: .3 },
      { transform: `translate(${tx - sx}px,${ty - sy}px) scale(.55)`, opacity: .9 }
    ], { duration: 750 + i * 35, delay: i * 40, easing: 'cubic-bezier(.45,0,.75,.55)', fill: 'forwards' });
    anim.onfinish = () => {
      el.remove(); coinsActive--;
      const m = $('#money'); m.classList.remove('bump'); void m.offsetWidth; m.classList.add('bump');
      if (!quiet || i === 0) sfx.tink();
    };
  }
}
function floatText(x, y, text, color) {

const confCv = $('#confetti'), confCtx = confCv.getContext('2d'); const conf = [];
function sizeConfetti() { confCv.width = innerWidth; confCv.height = innerHeight; }
sizeConfetti();
function confetti(n = 200) {
  const cols = ['#ffd23f', '#39ff8a', '#ff4fa3', '#4fd1ff', '#b48cff', '#ffffff', '#ff8a00'];
  for (let i = 0; i < n; i++) conf.push({ x: rand(0, innerWidth), y: rand(-innerHeight * .6, -10), vx: rand(-2, 2), vy: rand(2, 6),
    rot: rand(0, TAU), vr: rand(-.2, .2), w: rand(6, 12), h: rand(8, 16), c: pick(cols), sway: rand(0, TAU) });
}
function drawConfetti() {
  if (!conf.length) return;
  confCtx.clearRect(0, 0, confCv.width, confCv.height);
  for (let i = conf.length - 1; i >= 0; i--) {
    const p = conf[i]; p.sway += .08; p.x += p.vx + Math.sin(p.sway) * 1.2; p.y += p.vy; p.vy = Math.min(p.vy + .04, 7); p.rot += p.vr;
    if (p.y > confCv.height + 20) { conf.splice(i, 1); continue; }
    confCtx.save(); confCtx.translate(p.x, p.y); confCtx.rotate(p.rot); confCtx.scale(1, Math.abs(Math.cos(p.sway)) + .2);
    confCtx.fillStyle = p.c; confCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); confCtx.restore();
  }
  if (!conf.length) confCtx.clearRect(0, 0, confCv.width, confCv.height);
}

    <div class="row"><span>Capacity <span class="lvl">Lv ${A.cap}</span></span>${A.cap >= 17 ? btn('none', 'x', 'MAX', null, '', '$', 'disabled') : btn('acap', 'x', '+1 slot ' + fmt(capC), capC)}</div>
    <div class="row"><span>Speed <span class="lvl">Lv ${A.speed}</span></span>${autoTime() <= 0.4 ? btn('none', 'x', 'MAX', null, '', '$', 'disabled') : btn('aspd', 'x', '+15% ' + fmt(spdC), spdC)}</div>
    <div class="row"><span>Auto-buy</span><select id="abSel">${opts}</select><label class="switch"><input type="checkbox" id="abChk" ${A.autobuy ? 'checked' : ''}><span></span></label></div>
    <div class="note">Tap 🤖 on a card in your pile to queue it.</div>
    <ul class="log" id="mLog">${autoLog.map(l => `<li class="${l.c}">${l.t}</li>`).join('')}</ul>`;
  renderSlots(); refreshAfford();
}
const autoLog = [];
function logAuto(t, c) {
  autoLog.unshift({ t, c }); if (autoLog.length > 6) autoLog.pop();
  const ul = $('#mLog'); if (!ul) return;
  const li = document.createElement('li'); li.className = c; li.textContent = t; ul.prepend(li);
  while (ul.children.length > 6) ul.lastChild.remove();
}
function renderSlots() {
  const el = $('#mSlots'); if (!el) return;
  const A = S.auto; let h = '';
  const cap = autoCap();
  for (let i = 0; i < cap; i++) {
    const id = A.queue[i];
    if (id) { const d = DEFS[id]; h += `<div class="slot full ${i === 0 ? 'cur' : ''}" style="--c1:${d.c1};--c2:${d.c2}">${d.name.split(' ')[0]}</div>`; }
    else h += `<div class="slot"></div>`;
  }
  el.innerHTML = h;
  const m = $('#machine'); if (m) m.classList.toggle('run', A.queue.length > 0);
  const cur = $('#mCur'); if (cur) cur.textContent = A.queue.length ? `SCRATCHING: ${DEFS[A.queue[0]].name.toUpperCase()}` : 'IDLE — queue some cards';
}
function autoTick(dt) {
  const A = S.auto; if (!A.built) return;
  if (A.autobuy && A.queue.length < autoCap() && unlocked(A.abType)) {
    const price = DEFS[A.abType].price;
    if (S.money >= price) { S.money -= price; A.queue.push(A.abType); renderSlots(); renderPile(); }
  }
  if (A.queue.length) {
    autoProg += dt / autoTime();
    if (autoProg >= 1) {
      autoProg = 0;
      const id = A.queue.shift();
      const d = newCardData(id), amt = d.total;
      S.stats.scratched++;
      const m = $('#machine') || $('#left');
      if (amt > 0) {
        S.stats.wins++;
        pay(amt, m, true);
        logAuto(`${DEFS[id].name}: +${fmt(amt)}${d.jackpot ? ' JACKPOT!' : ''}`, 'w');
        const r = m.getBoundingClientRect(); floatText(r.left + r.width / 2, r.top + 20, '+' + fmt(amt));
        if (d.jackpot) { S.stats.jackpots++; confetti(300); sfx.jackpot(); shake(); toast('🤖 The Auto Scratcher hit the JACKPOT!'); }
      } else logAuto(`${DEFS[id].name}: no luck${d.skull ? ' ☠' : ''}`, 'l');
      renderSlots(); renderPile();
    }
  } else autoProg = 0;
  const bar = $('#mBar'); if (bar) bar.style.width = (A.queue.length ? autoProg * 100 : 0) + '%';
}

/* ---- actions ---- */
function spend(cost) { if (S.money < cost) { sfx.error(); return false; } S.money -= cost; return true; }
function doAction(act, id) {
  switch (act) {
    case 'buy': case 'buy5': {
      const n = act === 'buy5' ? 5 : 1;
      if (!unlocked(id) || !spend(DEFS[id].price * n)) return;
      S.pile[id] += n; brokeShown = false;
      if (!active) loadCard(id); else sfx.buy();
      renderPile(); renderShop();
      break;
    }
    case 'lvl': if (!spend(levelCost(id))) return; S.cardLv[id]++; sfx.upgrade(); toast(`⬆ ${DEFS[id].name} is now level ${S.cardLv[id]}!`); renderShop(); break;
    case 'upg': if (S.upg[id] >= UPGS[id].max || !spend(upgCost(id))) return; S.upg[id]++; sfx.upgrade(); renderShop(); if (S.auto.built) renderAuto(); break;
    case 'play':
      if (active) { toast('Finish your current card first!'); return; }
      loadCard(id); break;
    case 'toauto': {
      if (!S.auto.built || S.pile[id] <= 0) return;
      if (S.auto.queue.length >= autoCap()) { toast('Auto Scratcher is full!'); sfx.error(); return; }
      S.pile[id]--; S.auto.queue.push(id); sfx.click(); renderSlots(); renderPile(); renderShop(); break;
    }
    case 'build': if (S.auto.built || !spend(AUTO_COST)) return; S.auto.built = true; sfx.upgrade(); toast('🤖 Auto Scratcher built!'); renderAuto(); renderPile(); break;
    case 'acap': { const c = Math.ceil(500 * Math.pow(1.5, S.auto.cap)); if (!spend(c)) return; S.auto.cap++; sfx.upgrade(); renderAuto(); renderPile(); break; }
    case 'aspd': { const c = Math.ceil(750 * Math.pow(1.5, S.auto.speed)); if (!spend(c)) return; S.auto.speed++; sfx.upgrade(); renderAuto(); break; }
    case 'perk': { const p = PERKS[id], c = p.cost(S.perks[id]); if (S.perks[id] >= p.max || S.pp < c) return; S.pp -= c; S.perks[id]++; sfx.upgrade(); renderShop(); if (S.auto.built) renderAuto(); break; }
    case 'prestige': confirmPrestige(); break;
  }
  save(false);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  Snd.init(); doAction(b.dataset.act, b.dataset.id);
});
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { Snd.init(); sfx.click(); tab = t.dataset.tab; renderShop(); }));
$('#left').addEventListener('change', e => {
  if (e.target.id === 'abSel') S.auto.abType = e.target.value;
  if (e.target.id === 'abChk') { S.auto.autobuy = e.target.checked; sfx.click(); }
});

/* ---- prestige ---- */
function confirmPrestige() {
  const g = ppGain();
  if (S.runEarned < PRESTIGE_AT || g <= 0) return;
  modal('✨ Prestige?', `You will gain <b class="pp">${g} Prestige Points</b>.<br><br>Your cash, cards, card levels, upgrades and Auto Scratcher will be reset.
    Stats and prestige perks are kept forever.`, [
    { label: 'Cancel', cls: 'purple' },
    { label: `Prestige (+${g} PP)`, cls: 'pink', fn: doPrestige }
  ]);
}
function doPrestige() {
  const g = ppGain(); if (g <= 0) return;
  Object.assign(S, freshRun());
  S.pp += g; S.stats.prestiges++;
  S.money = startCash();
  if (active) unloadCard();
  autoProg = 0; autoLog.length = 0; moneyDisp = S.money;
  sfx.prestige(); confetti(250);
  toast(`✨ Prestiged! +${g} PP`);
  tab = 'prestige';
  renderAll(); save(false);
}

/* =========================================================
   MODALS
   ========================================================= */
function modal(title, body, buttons) {
  const m = $('#modal');
  m.innerHTML = `<h3>${title}</h3><div class="body">${body}</div><div class="mbtns"></div>`;
  const bw = m.querySelector('.mbtns');
  (buttons || [{ label: 'OK', cls: 'green' }]).forEach(b => {
    const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.innerHTML = b.label;
    el.addEventListener('click', () => { Snd.init(); sfx.click(); if (!b.keep) closeModal(); if (b.fn) b.fn(); });
    bw.appendChild(el);
  });
  $('#modalBg').classList.add('show');
}
function closeModal() { $('#modalBg').classList.remove('show'); }
$('#modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

$('#btnStats').addEventListener('click', () => {
  Snd.init(); sfx.click();
  const st = S.stats, wr = st.scratched ? (st.wins / st.scratched * 100).toFixed(1) + '%' : '—';
  const rows = [
    ['🎟️ Cards scratched', st.scratched.toLocaleString('en-US')], ['🏆 Winning cards', `${st.wins.toLocaleString('en-US')} (${wr})`],
    ['💥 Biggest win', fmt(st.biggest)], ['💰 Total earned (all time)', fmt(st.earned)], ['📈 Earned this run', fmt(S.runEarned)],
    ['🧽 Dishes washed', st.dishes.toLocaleString('en-US')], ['⭐ Jackpots hit', st.jackpots], ['✨ Prestiges', st.prestiges],
    ['💎 Prestige points', S.pp], ['💸 Loans taken', st.loans], ['🍀 Luck multiplier', '×' + luckMult().toFixed(2)], ['✖️ Money multiplier', '×' + moneyMult()]
  ];
  modal('📊 Stats', `<table class="stats">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`, [{ label: 'Close', cls: 'green' }]);
});
$('#btnSettings').addEventListener('click', () => {
  Snd.init(); sfx.click();
  modal('⚙️ Settings', `<p><b>How to play:</b> wash dishes for your first $5, buy scratch cards, drag to scratch the foil and win.
    Level up cards, buy Luck, build the Auto Scratcher and prestige once you've earned ${fmt(PRESTIGE_AT)} in a run.</p>
    <p style="font-size:13px;color:var(--muted)">Your game autosaves every 10 seconds. All money is pretend in-game cash.</p>`, [
    { label: S.muted ? '🔈 Unmute' : '🔇 Mute', cls: 'purple', fn: toggleMute },
    { label: '💾 Save now', cls: 'green', fn: () => { save(true); } },
    { label: '🗑️ Reset save', cls: 'red', fn: () => modal('Reset everything?', 'This permanently deletes your progress, stats and prestige. Are you sure?', [
      { label: 'Keep playing', cls: 'green' }, { label: 'Yes, reset', cls: 'red', fn: resetSave }]) }
  ]);
});
function toggleMute() { S.muted = !S.muted; Snd.setMuted(S.muted); $('#btnMute').textContent = S.muted ? '🔇' : '🔊'; save(false); }
$('#btnMute').addEventListener('click', () => { Snd.init(); toggleMute(); if (!S.muted) sfx.click(); });

/* ---- bankruptcy ---- */
let brokeShown = false;
function checkBroke() {
  const cheapest = DEFS.quick.price;
  const broke = S.money < cheapest && !active && S.auto.queue.length === 0 && !ORDER.some(id => S.pile[id] > 0) && S.stats.scratched > 0;
  if (!broke) { if (S.money >= cheapest) brokeShown = false; return; }
  if (brokeShown || $('#modalBg').classList.contains('show')) return;
  brokeShown = true;
  if (S.loan > 0) { toast('💸 Broke! Wash some dishes to get back on your feet.'); return; }
  modal('💸 You\'re broke!', `No cash and no cards left… Time to choose:<br><br>
    🏦 <b>Take a loan:</b> get <b>$50</b> right now. <b>20%</b> of all future winnings go to repayment until it's paid back.<br><br>
    🧽 <b>Back to the sink:</b> wash dishes until you can afford a card.`, [
    { label: '🧽 Wash dishes', cls: 'purple' },
    { label: '🏦 Take loan (+$50)', cls: 'green', fn: () => { S.money += 50; S.loan += 50; S.stats.loans++; sfx.coin(); toast('🏦 Loan taken: $50'); renderShop(); save(false); } }
  ]);
}

/* =========================================================
   SAVE / LOAD
   ========================================================= */
const KEY = 'scratchTycoon.save.v1';
let resetting = false;
function merge(def, src) {
  if (!src || typeof src !== 'object') return def;
  for (const k in def) {
    if (!(k in src)) continue;
    const dv = def[k], sv = src[k];
    if (Array.isArray(dv)) { if (Array.isArray(sv)) def[k] = sv; }
    else if (dv && typeof dv === 'object') merge(dv, sv);
    else if (typeof sv === typeof dv && (typeof sv !== 'number' || isFinite(sv))) def[k] = sv;
  }
  return def;
}
function save(announce) {
  if (resetting) return;
  try {
    const o = JSON.parse(JSON.stringify(S));
    if (active && !active.done) o.pile[active.type]++;   // an unfinished card goes back in the pile
    localStorage.setItem(KEY, JSON.stringify(o));
    if (announce) toast('💾 Game saved');
  } catch (e) { if (announce) toast('Could not save (storage unavailable)'); }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY); if (!raw) return false;
    S = merge(defaults(), JSON.parse(raw));
    S.auto.queue = S.auto.queue.filter(id => DEFS[id]).slice(0, autoCap());
    if (!DEFS[S.auto.abType]) S.auto.abType = 'quick';
    for (const id of ORDER) { S.pile[id] = Math.max(0, Math.floor(S.pile[id])); S.cardLv[id] = Math.max(1, Math.floor(S.cardLv[id])); }
    if (!(S.money >= 0)) S.money = 0;
    return true;
  } catch (e) { return false; }
}
function resetSave() {
  resetting = true;
  try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
}
setInterval(() => save(false), 10000);
addEventListener('beforeunload', () => save(false));
document.addEventListener('visibilitychange', () => { if (document.hidden) save(false); });

/* =========================================================
   MAIN LOOP
   ========================================================= */
let moneyDisp = 0, lastT = performance.now(), structKey = '', slowT = 0;
function renderAll() { renderShop(); renderAuto(); renderPile(); structKey = computeKey(); }
function computeKey() { return ORDER.map(id => unlocked(id) ? 1 : 0).join('') + (S.auto.built ? 'A' : 'a') + (S.runEarned >= PRESTIGE_AT ? 'P' : 'p'); }

function drawFx(dt) {
  xctx.clearRect(0, 0, W, H);
  if (!active) return;
  active.t += dt;
  if (active.done && active.d.hl.length) {
    const pulse = .5 + .5 * Math.sin(active.t * 9);
    for (const r of active.d.hl) {
      xctx.save();
      xctx.shadowColor = r.bad ? '#ff2040' : '#ffd23f'; xctx.shadowBlur = 12 + pulse * 14;
      rr(xctx, r.x - 3, r.y - 3, r.w + 6, r.h + 6, 12);
      xctx.lineWidth = 4 + pulse * 2; xctx.strokeStyle = r.bad ? '#ff2040' : (pulse > .5 ? '#fff6a8' : '#ffd23f'); xctx.stroke();
      xctx.restore();
    }
  }
  for (let i = flakes.length - 1; i >= 0; i--) {
    const f = flakes[i];
    f.vy += .22; f.x += f.vx; f.y += f.vy; f.rot += f.vr; f.life--;
    if (f.life <= 0 || f.y > H + 10) { flakes.splice(i, 1); continue; }
    xctx.save(); xctx.globalAlpha = Math.min(1, f.life / 20); xctx.translate(f.x, f.y); xctx.rotate(f.rot);
    xctx.fillStyle = f.col; xctx.fillRect(-f.s / 2, -f.s / 3, f.s, f.s * .66); xctx.restore();
  }
}

function frame(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  // rolling money counter
  const diff = S.money - moneyDisp;
  if (Math.abs(diff) < 0.5) moneyDisp = S.money; else moneyDisp += diff * Math.min(1, dt * 7) + Math.sign(diff) * Math.min(Math.abs(diff), 0.5);
  const mt = fmt(moneyDisp); const me = $('#money'); if (me.textContent !== mt) me.textContent = mt;
  const lt = S.loan > 0 ? `Loan owed: ${fmt(S.loan)}` : ''; const le = $('#loanInfo'); if (le.textContent !== lt) le.textContent = lt;

  autoTick(dt);
  drawFx(dt);
  drawConfetti();

  slowT += dt;
  if (slowT > 0.2) {
    slowT = 0;
    refreshAfford();
    const k = computeKey();
    if (k !== structKey) {
      const newly = ORDER.filter(id => unlocked(id) && structKey && structKey[ORDER.indexOf(id)] === '0');
      newly.forEach(id => { toast(`🎟️ New card unlocked: <b>${DEFS[id].name}</b>!`); sfx.upgrade(); });
      if (structKey && k.includes('P') && structKey.includes('p')) toast('✨ Prestige is now available!');
      renderAll();
    }
    updateEmpty();
    checkBroke();
  }
  requestAnimationFrame(frame);
}

addEventListener('resize', () => { sizeConfetti(); });

/* ---------------- boot ---------------- */
load();
moneyDisp = S.money;
$('#btnMute').textContent = S.muted ? '🔇' : '🔊';
renderAll();
unloadCard();
if (!S.seenHelp) {
  S.seenHelp = true;
  setTimeout(() => toast('🧽 Wash dishes to earn your first $5, then buy a scratch card!'), 600);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
