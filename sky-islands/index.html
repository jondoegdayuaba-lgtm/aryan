<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Islands</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#8fc9ff;font-family:monospace;color:#fff;
  user-select:none;-webkit-user-select:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.pt{display:block}
#view{position:fixed;inset:0;display:block;width:100%;height:100%}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:30}
.screen.show{display:flex}
.dim{background:rgba(10,14,30,.55)}
.btn{min-width:320px;height:46px;display:flex;align-items:center;justify-content:center;background:#6f6f6f;
  border:3px solid #111;box-shadow:inset 3px 3px 0 #a9a9a9,inset -3px -3px 0 #484848;cursor:pointer}
.btn:hover{background:#7c88c6;box-shadow:inset 3px 3px 0 #b8c0f2,inset -3px -3px 0 #4a5498}
.btn:active{transform:translateY(1px)}
.panel{background:#c6c6c6;border:3px solid #111;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555;padding:14px 16px;color:#333}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.lines{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
#menu{background:linear-gradient(180deg,rgba(40,90,170,.15),rgba(10,20,50,.35))}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
#top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:22px;align-items:center;
  background:rgba(0,0,0,.35);padding:7px 14px;border:2px solid rgba(0,0,0,.4)}
#feed{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#feed>div{background:rgba(0,0,0,.4);padding:4px 6px;transition:opacity .5s}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);mix-blend-mode:difference}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{left:10px;top:0;width:2px;height:22px}
#cross:after{left:0;top:10px;width:22px;height:2px}
#crouchTag{position:absolute;left:50%;bottom:128px;transform:translateX(-50%);display:none;background:rgba(0,0,0,.45);padding:4px 8px}
#debug{position:absolute;left:8px;top:8px;display:none;flex-direction:column;gap:3px;align-items:flex-start}
#debug>canvas{background:rgba(0,0,0,.4);padding:1px 2px}
#plist{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:none;flex-direction:column;gap:3px;align-items:stretch;background:rgba(0,0,0,.55);padding:8px 10px;min-width:280px}
#plist>div{display:flex;justify-content:space-between;gap:24px}
#charge{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);width:60px;height:6px;background:rgba(0,0,0,.5);display:none}
#charge>div{height:100%;width:0;background:#fff}
#big{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);text-align:center}
#sub{position:absolute;left:50%;top:calc(32% + 70px);transform:translateX(-50%)}
#bottom{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
#itemname{height:20px;transition:opacity .4s}
#bars{width:460px;display:flex;justify-content:space-between;align-items:flex-end}
#hearts,#armorbar{display:flex;gap:1px}
#hearts img,#armorbar img{width:18px;height:18px;image-rendering:pixelated}
#hotbar{display:flex;background:rgba(0,0,0,.45);border:3px solid #111;padding:2px}
.hs{width:50px;height:50px;position:relative;border:3px solid #8b8b8b;margin:0 1px;background:rgba(80,80,80,.35)}
.hs.sel{border-color:#fff;box-shadow:0 0 0 2px #000}
.hs img,.slot img{position:absolute;left:50%;top:50%;width:32px;height:32px;transform:translate(-50%,-50%);image-rendering:pixelated}
.cnt{position:absolute;right:2px;bottom:1px}
#hurt{position:absolute;inset:0;box-shadow:inset 0 0 120px 40px rgba(220,0,0,.55);opacity:0;transition:opacity .25s}
#vignetteSD{position:absolute;inset:0;box-shadow:inset 0 0 160px 30px rgba(255,90,0,.25);display:none}
#invpanel{display:flex;flex-direction:column;gap:6px}
.grid{display:grid;grid-template-columns:repeat(9,40px);gap:2px}
.slot{width:40px;height:40px;position:relative;background:#8b8b8b;box-shadow:inset 2px 2px 0 #373737,inset -2px -2px 0 #fff;cursor:pointer}
.slot:hover{background:#a8a8a8}
.slot .ghost{opacity:.22}
.armrow{display:flex;gap:2px;align-items:center}
#cursorItem{position:fixed;width:32px;height:32px;pointer-events:none;z-index:60;display:none;transform:translate(-50%,-50%)}
#cursorItem img{width:32px;height:32px;image-rendering:pixelated}
#cursorItem .cnt{right:-4px;bottom:-4px}
#tooltip{position:fixed;z-index:61;pointer-events:none;background:#1a0a2a;border:2px solid #3a1a6a;padding:4px 6px;display:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#8fc9ff;z-index:100;color:#123;font:bold 18px monospace;text-align:center;padding:20px}
#endstats{display:flex;flex-direction:column;gap:8px;align-items:center;margin:8px 0 10px}
</style>
</head>
<body>
<div id="loading">LOADING SKY ISLANDS...</div>
<div id="hud">
  <div id="vignetteSD"></div>
  <div id="hurt"></div>
  <div id="top"><div id="tPlayers"></div><div id="tTime"></div><div id="tEvent"></div></div>
  <div id="feed"></div>
  <div id="cross"></div>
  <div id="debug"></div>
  <div id="plist"></div>
  <div id="charge"><div></div></div>
  <div id="crouchTag"></div>
  <div id="big"></div>
  <div id="sub"></div>
  <div id="bottom">
    <div id="itemname"></div>
    <div id="bars"><div id="hearts"></div><div id="armorbar"></div></div>
    <div id="hotbar"></div>
  </div>
</div>
<div id="menu" class="screen">
  <div id="title"></div>
  <div id="subtitle" style="margin-bottom:22px"></div>
  <div class="btn" id="bPlay"></div>
  <div class="btn" id="bMap"></div>
  <div class="btn" id="bDiff"></div>
  <div class="btn" id="bControls"></div>
  <div id="menuHint" style="margin-top:18px;opacity:.85"></div>
</div>
<div id="controls" class="screen dim">
  <div class="panel col">
    <div id="ctTitle"></div>
    <div class="lines" id="ctLines"></div>
  </div>
  <div class="btn" id="bBack"></div>
</div>
<div id="pause" class="screen dim">
  <div id="pTitle" style="margin-bottom:16px"></div>
  <div class="btn" id="bResume"></div>
  <div class="btn" id="bPControls"></div>
  <div class="btn" id="bQuit"></div>
</div>
<div id="end" class="screen dim">
  <div id="endTitle"></div>
  <div id="endstats"></div>
  <div class="btn" id="bAgain"></div>
  <div class="btn" id="bMenu"></div>
</div>
<div id="inv" class="screen dim">
  <div class="panel" id="invpanel">
    <div id="chestBox" class="col" style="align-items:flex-start;gap:6px">
      <div id="chestTitle"></div>
      <div class="grid" id="chestGrid"></div>
    </div>
    <div id="armTitle" style="margin-top:4px"></div>
    <div class="armrow" id="armorGrid"></div>
    <div id="invTitle" style="margin-top:4px"></div>
    <div class="grid" id="mainGrid"></div>
    <div class="grid" id="hotGrid" style="margin-top:6px"></div>
    <div id="invHint" style="margin-top:6px"></div>
  </div>
</div>
<div id="cursorItem"></div>
<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
(function () {
if (!window.THREE) {
  document.getElementById('loading').textContent = 'Could not load Three.js from cdnjs. Check your internet connection and reload.';

}
const V3 = THREE.Vector3;

/* =========================================================================
   Utilities
   ========================================================================= */
const R = (a, b) => a + Math.random() * (b - a);

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const $ = id => document.getElementById(id);

/* =========================================================================
   Pixel font (5x7, proportional)
   ========================================================================= */
const GLYPHS = {
  A:'01110,10001,10001,11111,10001,10001,10001', B:'11110,10001,10001,11110,10001,10001,11110',
  C:'01110,10001,10000,10000,10000,10001,01110', D:'11110,10001,10001,10001,10001,10001,11110',
  E:'11111,10000,10000,11110,10000,10000,11111', F:'11111,10000,10000,11110,10000,10000,10000',
  G:'01110,10001,10000,10111,10001,10001,01111', H:'10001,10001,10001,11111,10001,10001,10001',
  I:'111,010,010,010,010,010,111', J:'00111,00010,00010,00010,00010,10010,01100',
  K:'10001,10010,10100,11000,10100,10010,10001', L:'10000,10000,10000,10000,10000,10000,11111',
  M:'10001,11011,10101,10101,10001,10001,10001', N:'10001,11001,10101,10011,10001,10001,10001',
  O:'01110,10001,10001,10001,10001,10001,01110', P:'11110,10001,10001,11110,10000,10000,10000',
  Q:'01110,10001,10001,10001,10101,10010,01101', R:'11110,10001,10001,11110,10100,10010,10001',
  S:'01111,10000,10000,01110,00001,00001,11110', T:'11111,00100,00100,00100,00100,00100,00100',
  U:'10001,10001,10001,10001,10001,10001,01110', V:'10001,10001,10001,10001,10001,01010,00100',
  W:'10001,10001,10001,10101,10101,10101,01010', X:'10001,10001,01010,00100,01010,10001,10001',
  Y:'10001,10001,01010,00100,00100,00100,00100', Z:'11111,00001,00010,00100,01000,10000,11111',
  0:'01110,10001,10011,10101,11001,10001,01110', 1:'010,110,010,010,010,010,111',
  2:'01110,10001,00001,00010,00100,01000,11111', 3:'11111,00010,00100,00010,00001,10001,01110',
  4:'00010,00110,01010,10010,11111,00010,00010', 5:'11111,10000,11110,00001,00001,10001,01110',
  6:'00110,01000,10000,11110,10001,10001,01110', 7:'11111,00001,00010,00100,01000,01000,01000',
  8:'01110,10001,10001,01110,10001,10001,01110', 9:'01110,10001,10001,01111,00001,00010,01100',
  '.':'0,0,0,0,0,0,1', ',':'00,00,00,00,00,01,10', ':':'0,1,1,0,1,1,0', '!':'1,1,1,1,1,0,1',
  '?':'01110,10001,00001,00010,00100,00000,00100', '-':'0000,0000,0000,1111,0000,0000,0000',
  '+':'00000,00100,00100,11111,00100,00100,00000', '/':'00001,00010,00010,00100,01000,01000,10000',
  "'":'1,1,0,0,0,0,0', '(':'001,010,100,100,100,010,001', ')':'100,010,001,001,001,010,100',
  '%':'11001,11010,00010,00100,01000,01011,10011', '<':'0001,0010,0100,1000,0100,0010,0001',
  '>':'1000,0100,0010,0001,0010,0100,1000', '=':'0000,0000,1111,0000,1111,0000,0000',
  '#':'01010,01010,11111,01010,11111,01010,01010', '*':'00000,10101,01110,11111,01110,10101,00000',
  '_':'00000,00000,00000,00000,00000,00000,11111', '[':'11,10,10,10,10,10,11', ']':'11,01,01,01,01,01,11',
  ' ':'000,000,000,000,000,000,000'

const FONT = {};
for (const ch in GLYPHS) { const rows = GLYPHS[ch].split(','); FONT[ch] = { rows, w: rows[0].length }; }
function measureText(s) { let w = 0; for (const c of s) w += (FONT[c] || FONT['?']).w + 1; return Math.max(0, w - 1); }
function shadowOf(col) {

function drawText(g, str, x0, y0, scale, color, shadow) {
  str = String(str).toUpperCase();
  const pass = (ox, oy, col) => {
    g.fillStyle = col; let x = 0;
    for (const ch of str) {
      const gl = FONT[ch] || FONT['?'];
      for (let r = 0; r < 7; r++) { const row = gl.rows[r]; for (let i = 0; i < gl.w; i++) if (row[i] === '1') g.fillRect(x0 + (ox + x + i) * scale, y0 + (oy + r) * scale, scale, scale); }
      x += gl.w + 1;

function textCanvas(str, scale = 2, color = '#fff', shadow = true) {
  str = String(str).toUpperCase();
  const sh = shadow ? 1 : 0, w = measureText(str);
  const c = document.createElement('canvas');
  c.width = Math.max(1, (w + sh) * scale); c.height = (7 + sh) * scale;
  drawText(c.getContext('2d'), str, 0, 0, scale, color, shadow);
  c.className = 'pt'; return c;
}
function setText(el, str, scale = 2, color = '#fff', shadow = true) {
  const key = str + '|' + scale + '|' + color + '|' + shadow;
  if (el._k === key) return; el._k = key; el.innerHTML = ''; el.appendChild(textCanvas(str, scale, color, shadow));

/* =========================================================================
   Sound (Web Audio synth)
   ========================================================================= */
const Sound = {
  ctx: null, master: null, noiseBuf: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }

    this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.45; this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate; const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = b.getChannelData(0);

  },
  tone(f, dur, type, vol, f2, delay) {
    const c = this.ctx; if (!c || vol < 0.003) return; const t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain(); o.type = type || 'square';
    o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);

    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq, ftype, delay, q) {
    const c = this.ctx; if (!c || vol < 0.003) return; const t = c.currentTime + (delay || 0);
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = ftype || 'lowpass'; f.frequency.value = freq || 1000; f.Q.value = q || 1;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);

  },
  play(name, pos) {
    if (!this.ctx) return;
    let v = 1;
    if (pos) { const d = pos.distanceTo(camera.position); v = Math.max(0, 1 - d / 42); if (v <= 0.02) return; }
    const T = (f, d, ty, vol, f2, dl) => this.tone(f, d, ty, vol * v, f2, dl);

      case 'hit': N(.12, .4, 900); T(170, .12, 'square', .12, 70); break;
      case 'crit': N(.12, .4, 900); T(170, .12, 'square', .12, 70); T(1300, .12, 'triangle', .1, 2200); break;
      case 'hurt': T(240, .2, 'square', .14, 110); N(.1, .2, 700); break;
      case 'swish': N(.1, .12, 2400, 'bandpass', 0, 2); break;

      case 'break': N(.16, .4, 1500, 'bandpass'); N(.1, .25, 400, 'lowpass', .03); break;
      case 'dig': N(.05, .16, 1000, 'bandpass'); break;

      case 'arrowhit': N(.06, .3, 2200); T(650, .05, 'square', .05, 300); break;
      case 'throw': N(.14, .18, 2800, 'bandpass', 0, 1.5); break;
      case 'snowhit': N(.1, .3, 1800, 'lowpass'); break;
      case 'orb': T(280, .45, 'sine', .22, 1300); T(420, .45, 'triangle', .1, 1900); break;
      case 'eat': for (let i = 0; i < 3; i++) N(.07, .28, 1300, 'bandpass', i * .11); T(520, .25, 'square', .07, 820, .34); break;
      case 'pop': T(800, .07, 'square', .07, 1350); break;

      case 'death': T(420, .6, 'square', .14, 80); break;
      case 'void': N(.6, .2, 600, 'lowpass'); T(300, .6, 'sine', .1, 60); break;
      case 'alert': T(880, .18, 'square', .11); T(880, .18, 'square', .11, null, .25); T(1175, .3, 'square', .11, null, .5); break;
      case 'click': T(1000, .04, 'square', .05); break;

/* =========================================================================
   Textures: block atlas, icons
   ========================================================================= */
const TILE = 16, ATL = 8;
const TL = { SNOW_TOP: 16, SNOW_SIDE: 17, ICE: 18, SPRUCE_LOG: 19, SPRUCE_LEAVES: 20, SAND: 21, SANDSTONE_SIDE: 22, SANDSTONE_TOP: 23, CACTUS_SIDE: 24, CACTUS_TOP: 25, REDROCK: 26, BASALT_SIDE: 27, BASALT_TOP: 28, LAVA: 29, OBSIDIAN: 30, MAGMA: 31, CHISELED: 32, GRASS_TOP: 0, GRASS_SIDE: 1, DIRT: 2, STONE: 3, PLANKS: 4, LOG_SIDE: 5, LOG_TOP: 6, LEAVES: 7, GLASS: 8, CHEST_SIDE: 9, CHEST_FRONT: 10, CHEST_TOP: 11, COBBLE: 12, BRICKS: 13, WOOL: 14, GOLD: 15 };
const tileCanvas = [];
const rgb = (r, g, b, a) => a === undefined ? `rgb(${r | 0},${g | 0},${b | 0})` : `rgba(${r | 0},${g | 0},${b | 0},${a})`;
function vary(base, r, amt) { const k = 1 + (r() - 0.5) * amt; return rgb(base[0] * k, base[1] * k, base[2] * k); }
function makeTiles() {
  const rnd = mulberry32(1337);
  const mk = (fn) => { const c = document.createElement('canvas'); c.width = c.height = TILE; const g = c.getContext('2d'); const P = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); }; fn(P, g); return c; };
  const dirtFn = (P) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const r = rnd(); P(x, y, r < 0.12 ? rgb(96, 66, 44) : r > 0.93 ? rgb(160, 120, 90) : vary([134, 96, 67], rnd, .3)); } };
  tileCanvas[TL.GRASS_TOP] = mk(P => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) P(x, y, rnd() < .1 ? rgb(78, 135, 42) : vary([98, 162, 56], rnd, .3)); });

  const mk = (parent, kind, idx) => { const d = document.createElement('div'); d.className = 'slot'; d.dataset.kind = kind; d.dataset.idx = idx; parent.appendChild(d); return d; };
  ui.slotEls = { chest: [], inv: [], armor: [] };
  for (let i = 0; i < 27; i++) ui.slotEls.chest.push(mk($('chestGrid'), 'chest', i));
  for (let i = 9; i < 36; i++) ui.slotEls.inv[i] = mk($('mainGrid'), 'inv', i);
  for (let i = 0; i < 9; i++) ui.slotEls.inv[i] = mk($('hotGrid'), 'inv', i);

  $('invpanel').addEventListener('mousedown', e => {

  });
  $('inv').addEventListener('mousedown', e => {

    dropItem(ui.cursor.id, n, player.pos.x + d.x * .5, player.eyeY() - .3, player.pos.z + d.z * .5, d.x * 5, d.y * 5 + 2, d.z * 5, player);

  // buttons
  const click = (id, fn) => $(id).addEventListener('click', () => { Sound.init(); Sound.play('click'); fn(); });
  click('bPlay', startGame);
  click('bMap', () => { game.map = MAP_ORDER[(MAP_ORDER.indexOf(game.map) + 1) % MAP_ORDER.length]; updateMapButton(); genWorld(12345); });
  click('bDiff', () => { const o = ['easy', 'normal', 'hard']; game.diff = o[(o.indexOf(game.diff) + 1) % 3]; updateDiffButton(); });
  click('bControls', () => { ui.controlsFrom = 'menu'; showScreen('controls'); });
  click('bBack', () => showScreen(ui.controlsFrom || 'menu'));
  click('bResume', () => { lockPointer(); });
  click('bPControls', () => { ui.controlsFrom = 'pause'; showScreen('controls'); });
  click('bQuit', quitToMenu);
  click('bAgain', startGame);
  click('bMenu', quitToMenu);
}
function showPlayerList(on) {
  const el = $('plist'); if (!on || !player) { el.style.display = 'none'; return; }
  el.innerHTML = '';
  const row = (a, b, c) => { const d = document.createElement('div'); d.appendChild(textCanvas(a, 2, c)); d.appendChild(textCanvas(b, 2, c)); el.appendChild(d); };
  row('PLAYER', 'KILLS', '#ffe14d');
  for (const e of [...ents].sort((a, b) => b.alive - a.alive || b.kills - a.kills)) row(e.isPlayer ? 'YOU' : e.name, String(e.kills), !e.alive ? '#777777' : e.isPlayer ? '#9dff9d' : '#ffffff');
  el.style.display = 'flex';
}
function updateDebug(dt) {

  if (pstate.fpsT < 0.25) return;
  pstate.fps = Math.round(pstate.frames / pstate.fpsT); pstate.frames = 0; pstate.fpsT = 0;
  if (!pstate.debug || !player) return;
  const dirs = ['SOUTH', 'WEST', 'NORTH', 'EAST'], a = ((-player.yaw * 180 / Math.PI + 180) % 360 + 360) % 360;
  const el = $('debug'); el.innerHTML = '';
  ['SKY ISLANDS  ' + pstate.fps + ' FPS', 'XYZ: ' + player.pos.x.toFixed(2) + ' / ' + player.pos.y.toFixed(2) + ' / ' + player.pos.z.toFixed(2),
   'BLOCK: ' + Math.floor(player.pos.x) + ' ' + Math.floor(player.pos.y) + ' ' + Math.floor(player.pos.z), 'FACING: ' + dirs[Math.round(a / 90) % 4],
   'BLOCKS: ' + world.map.size + '  ENTITIES: ' + aliveCount() + '  PARTICLES: ' + particles.list.length].forEach(t => el.appendChild(textCanvas(t, 2)));
}
function updateMapButton() { const m = MAPS[game.map]; setText($('bMap'), 'MAP: ' + m.name, 3, m.title); setText($('menuHint'), m.genre + ' - BRIDGE TO THE CENTER FOR BETTER LOOT', 2, '#e8f4ff'); }
function updateDiffButton() { const c = { easy: '#9dff9d', normal: '#ffffff', hard: '#ff9d9d' }[game.diff]; setText($('bDiff'), 'DIFFICULTY: ' + game.diff.toUpperCase(), 3, c); }
function renderStack(el, st, ghost) {
  el.innerHTML = '';
  if (st) { const im = document.createElement('img'); im.src = ICON[st.id]; el.appendChild(im); if (st.count > 1) { const c = textCanvas(String(st.count), 2); c.classList.add('cnt'); el.appendChild(c); } }
  else if (ghost) { const im = document.createElement('img'); im.src = ICON[ghost]; im.className = 'ghost'; el.appendChild(im); }
}
function hudRefreshAll() { ui.sig = ''; ui.hpSig = ''; ui.topSig = ''; }
function updateHUD(dt) {
  if (!player) return;
  // hotbar
  let sig = player.sel + ':';
  for (let i = 0; i < 9; i++) { const s = player.inv.slots[i]; sig += s ? s.id + s.count + ',' : '-,'; }
  if (sig !== ui.sig) {
    ui.sig = sig;
    for (let i = 0; i < 9; i++) { renderStack(ui.hb[i], player.inv.slots[i]); ui.hb[i].classList.toggle('sel', i === player.sel); }
  }
  if (pstate.lastSel !== player.sel || pstate.lastHeld !== (player.held && player.held.id)) { pstate.lastSel = player.sel; pstate.lastHeld = player.held && player.held.id; pstate.itemNameT = 2; }
  pstate.itemNameT -= dt;
  const nameEl = $('itemname');
  if (player.held) setText(nameEl, ITEMS[player.held.id].name, 2); else nameEl.innerHTML = '', nameEl._k = '';
  nameEl.style.opacity = pstate.itemNameT > 0 ? 1 : 0;
  // hearts & armour
  const hp = Math.max(0, Math.ceil(player.health)), ap = player.armorPts(), hs = hp + '/' + ap;
  if (hs !== ui.hpSig) {
    ui.hpSig = hs;
    for (let i = 0; i < 10; i++) ui.hearts[i].src = hp >= (i + 1) * 2 ? HEART.full : hp === i * 2 + 1 ? HEART.half : HEART.empty;
    $('armorbar').style.visibility = ap > 0 ? 'visible' : 'hidden';
    for (let i = 0; i < 10; i++) ui.armor[i].src = ap >= (i + 1) * 2 ? ARMI.full : ap === i * 2 + 1 ? ARMI.half : ARMI.empty;
  }
  // low-health heart wobble

  else if (ui.hearts[0].style.transform) ui.hearts.forEach(h => h.style.transform = '');
  // top bar
  const alive = aliveCount();
  setText($('tPlayers'), 'PLAYERS LEFT: ' + alive, 2, '#ffffff');
  setText($('tTime'), 'TIME ' + fmtTime(game.time), 2, '#ffffff');
  let ev, evc = '#ffe14d';
  if (game.phase === 'countdown') ev = 'STARTING...';
  else if (game.time < REFILL_T) ev = 'CHEST REFILL ' + fmtTime(REFILL_T - game.time);
  else if (game.time < SUDDEN_T) { ev = 'SUDDEN DEATH ' + fmtTime(SUDDEN_T - game.time); evc = '#ffa040'; }
  else { ev = 'SUDDEN DEATH!'; evc = '#ff5040'; }

  // big / sub messages

  if (ui.subT !== undefined) { ui.subT -= dt; $('sub').style.opacity = ui.subT > 0 ? Math.min(1, ui.subT * 2) : 0; }
  // bow charge
  const ch = $('charge'); if (pstate.charging) { ch.style.display = 'block'; ch.firstChild.style.width = Math.min(100, pstate.bowT * 100) + '%'; ch.firstChild.style.background = pstate.bowT >= 1 ? '#ffe14d' : '#fff'; } else ch.style.display = 'none';
  $('cross').style.display = player.alive ? 'block' : 'none';
  $('crouchTag').style.display = player.alive && player.crouch ? 'block' : 'none';
}

/* ---- Inventory / chest screen ---- */
function openInventory(chest) {
  ui.chest = chest || null;
  if (ui.chest) Sound.play('chest');
  ui.invOpen = true; ui.cursor = null;
  breaking.reset(); pstate.charging = false; mouse[0] = mouse[1] = mouse[2] = false;
  $('chestBox').style.display = ui.chest ? 'flex' : 'none';
  if (ui.chest) setText($('chestTitle'), ui.chest.center ? 'CENTER CHEST' : 'CHEST', 2, '#404040', false);
  renderInventory(); showScreen('inv');
  if (document.pointerLockElement) document.exitPointerLock();
}
function closeInventory(noLock) {
  if (!ui.invOpen) return;
  ui.invOpen = false;
  if (ui.cursor && player) { const left = player.inv.add(ui.cursor.id, ui.cursor.count); if (left > 0) dropItem(ui.cursor.id, left, player.pos.x, player.eyeY(), player.pos.z, 0, 2, 0, player); }
  ui.cursor = null; ui.chest = null; $('cursorItem').style.display = 'none'; $('tooltip').style.display = 'none';
  showScreen(null);
  if (!noLock && inGame() && player && player.alive) lockPointer();
}
function getSlot(ref) { if (ref.kind === 'chest') return ui.chest ? ui.chest.items[ref.idx] : null; if (ref.kind === 'armor') return player.inv.armor[ref.idx]; return player.inv.slots[ref.idx]; }

function canPut(ref, st) { if (!st) return true; if (ref.kind !== 'armor') return true; const it = ITEMS[st.id]; return it.type === 'armor' && it.slot === ref.idx; }
function addToList(list, from, to, st) { // merge into list[from..to)
  const max = ITEMS[st.id].stack;
  for (let i = from; i < to && st.count > 0; i++) { const s = list[i]; if (s && s.id === st.id && s.count < max) { const n = Math.min(max - s.count, st.count); s.count += n; st.count -= n; } }
  for (let i = from; i < to && st.count > 0; i++) if (!list[i]) { list[i] = { id: st.id, count: st.count }; st.count = 0; }
  return st.count;
}
function slotClick(ref, button, shift) {
  if (ref.kind === 'chest' && !ui.chest) return;
  const cur = getSlot(ref);
  Sound.play('click');
  if (shift && cur) {
    const st = { id: cur.id, count: cur.count }; const it = ITEMS[cur.id];
    if (ref.kind === 'chest') { addToList(player.inv.slots, 0, 36, st); }
    else if (ref.kind === 'armor') { addToList(player.inv.slots, 0, 36, st); }
    else if (it.type === 'armor' && !player.inv.armor[it.slot]) { player.inv.armor[it.slot] = { id: cur.id, count: 1 }; st.count = 0; }
    else if (ui.chest) addToList(ui.chest.items, 0, 27, st);
    else if (ref.idx < 9) addToList(player.inv.slots, 9, 36, st);
    else addToList(player.inv.slots, 0, 9, st);
    setSlot(ref, st.count > 0 ? st : null);
  } else if (button === 2) {
    if (!ui.cursor && cur) { const half = Math.ceil(cur.count / 2); ui.cursor = { id: cur.id, count: half }; cur.count -= half; if (cur.count <= 0) setSlot(ref, null); }
    else if (ui.cursor && canPut(ref, ui.cursor)) {
      if (!cur) { setSlot(ref, { id: ui.cursor.id, count: 1 }); ui.cursor.count--; }
      else if (cur.id === ui.cursor.id && cur.count < ITEMS[cur.id].stack) { cur.count++; ui.cursor.count--; }
      if (ui.cursor.count <= 0) ui.cursor = null;

      else { setSlot(ref, ui.cursor); ui.cursor = cur; }
    }

}
function swapWithHotbar(ref, h) {
  if (ref.kind === 'inv' && ref.idx === h) return;

  if (!canPut(ref, b)) return;
  setSlot(ref, b); player.inv.slots[h] = a; renderInventory(); updateTooltip();
}

  if (!ui.invOpen) return;
  if (player && player.mesh) refreshArmorVisual(player);
  if (ui.chest) for (let i = 0; i < 27; i++) renderStack(ui.slotEls.chest[i], ui.chest.items[i]);
  for (let i = 0; i < 36; i++) renderStack(ui.slotEls.inv[i], player.inv.slots[i]);
  for (let i = 0; i < 4; i++) renderStack(ui.slotEls.armor[i], player.inv.armor[i], ARMOR_KEYS[i] + '_leather');

}
function updateTooltip() {

  const it = ITEMS[st.id]; tt.innerHTML = '';
  tt.appendChild(textCanvas(it.name, 2, '#ffffff'));
  let extra = it.type === 'sword' ? '+' + it.dmg + ' ATTACK DAMAGE' : it.type === 'armor' ? '+' + it.pts + ' ARMOR' : it.type === 'food' ? 'HEALS AND REGENERATES' : st.id === 'orb' ? 'THROW TO TELEPORT' : st.id === 'snowball' ? 'KNOCKS PLAYERS BACK' : it.block ? 'BUILDING BLOCK' : st.id === 'bow' ? 'NEEDS ARROWS' : '';

/* =========================================================================
   Main loop
   ========================================================================= */
function update(dt) {
  updateClouds(dt);
  if (game.phase === 'menu') {
    game.menuT += dt;
    const a = game.menuT * 0.06; camera.position.set(Math.cos(a) * 52, TOPY + 22, Math.sin(a) * 52);
    camera.lookAt(0, TOPY - 2, 0);
    particles.update(dt);
    return;
  }
  if (game.paused) return;
  if (game.phase === 'countdown') {
    game.countdown -= dt;
    const n = Math.ceil(game.countdown);
    if (n !== game.lastCount && n > 0) { game.lastCount = n; bigMessage(String(n), n <= 3 ? '#ff6060' : '#ffe14d', 1.0); Sound.play('beep'); subMessage(MAPS[game.map].name + ' - ' + MAPS[game.map].genre, MAPS[game.map].title, 1.2); }
    if (game.countdown <= 0) {
      game.phase = 'playing'; game.time = 0; breakCages(); bigMessage('GO!', '#7dff7d', 1.2); Sound.play('go');
      subMessage('RIGHT CLICK CHESTS, SHIFT TO SNEAK', '#ffffff', 4);
    }
  } else if (game.phase === 'playing' || game.phase === 'over') {
    if (game.phase === 'playing') game.time += dt;
    if (!game.refilled && game.time >= REFILL_T) {

      for (const e of ents) if (e.ai) e.ai.looted.clear();
      bigMessage('CHESTS REFILLED!', '#7dff7d', 2.5, true); Sound.play('alert'); addFeed('ALL CHESTS HAVE BEEN REFILLED', '#7dff7d'); renderInventory();
    }
    if (!game.sudden && game.time >= SUDDEN_T) {
      game.sudden = true; bigMessage('SUDDEN DEATH!', '#ff5040', 3); subMessage('THE ISLANDS ARE CRUMBLING!', '#ffa040', 3.5); Sound.play('alert');
      $('vignetteSD').style.display = 'block'; addFeed('SUDDEN DEATH - ISLANDS CRUMBLE', '#ff8040');
    }
    if (game.sudden && game.phase === 'playing') { game.sdT -= dt; if (game.sdT <= 0) { game.sdT = 0.2; crumbleStep(); } }
  }

    if (!e.alive) continue;

    }
    if (e.regenBoost > 0) e.regenBoost -= dt;
    if (e.pos.y < VOID_Y && e.alive) kill(e, 'void', null);
    if (e.alive && game.phase === 'playing') hazards(e, dt);
  }
  separateEntities();
  for (const e of ents) if (e.mesh) animateHumanoid(e, dt);
  updateProjectiles(dt); updateDrops(dt); particles.update(dt);
  // camera
  if (player && player.alive) {
    const sp = Math.hypot(player.vel.x, player.vel.z), bob = player.onGround ? Math.sin(pstate.bob * 2) * 0.035 * Math.min(1, sp / 5) : 0;
    camera.position.set(player.pos.x, player.eyeY() + bob, player.pos.z);
    camera.rotation.set(player.pitch, player.yaw, player.hurtT > 0 ? Math.sin(player.hurtT * 20) * 0.03 : 0);
    player.mesh.visible = pstate.view !== 0;
    if (pstate.view !== 0) { // F5: third person behind / in front, pulled in if a block is in the way
      const eye = eyePos(player), back = lookDir(player.yaw, player.pitch).multiplyScalar(pstate.view === 1 ? -1 : 1);
      const hit = raycastBlock(eye, back, 4); const dist = hit ? Math.max(0.3, hit.t - 0.3) : 4;
      camera.position.copy(eye).addScaledVector(back, dist);
      if (pstate.view === 2) camera.lookAt(eye);
    }
    const tf = (player.sprinting ? 84 : 75) - (pstate.charging ? Math.min(1, pstate.bowT) * 12 : 0);
    pstate.fov += (tf - pstate.fov) * (1 - Math.exp(-10 * dt));
    if (Math.abs(camera.fov - pstate.fov) > 0.05) { camera.fov = pstate.fov; camera.updateProjectionMatrix(); }
  } else if (player) {

    camera.position.set(Math.cos(a) * 45, TOPY + 20, Math.sin(a) * 45); camera.lookAt(0, TOPY, 0);
    if (camera.fov !== 75) { camera.fov = 75; camera.updateProjectionMatrix(); }

  updateHUD(dt);

}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt);
  renderer.clear(); renderer.render(scene, camera);
  if (vm.group.visible) { renderer.clearDepth(); renderer.render(vmScene, vmCamera); }
}
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = vmCamera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); vmCamera.updateProjectionMatrix();
});

setupUI();
genWorld(12345);
showScreen('menu');
$('loading').style.display = 'none';
requestAnimationFrame(frame);
// small debug/test handle
window.SkyIslands = { ui, game, pstate, get ents() { return ents; }, get player() { return player; }, world, startGame, update, ITEMS, kill, closeInventory, openInventory, slotClick, setPaused: v => { game.paused = v; }, _setLocked: v => { locked = v; if (v) { game.paused = false; showScreen(null); } } };
})();
